<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Quét QR Chấm Công</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #00c6ff;
            margin: 0;
            padding: 10px;
        }

        h2 {
            color: white;
            font-weight: bold;
        }

        #video-container {
            width: 100%;
            max-width: 350px;
            margin: auto;
            position: relative;
        }

        video {
            width: 100%;
            border-radius: 10px;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #result {
            margin-top: 10px;
            color: white;
            font-weight: bold;
        }

        button {
            margin-top: 12px;
            padding: 12px;
            width: 90%;
            max-width: 300px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

        #logoutBtn {
            background: #ff3333;
        }

        #viewBtn {
            background: #005ae0;
        }

        #Local {
            background: green;
        }

        #reset {
            background: #cc00FF;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>


    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

</head>
<body>

<h2>📸 QUÉT MÃ QR</h2>

<div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div id="result">Đang mở camera...</div>

<button id="viewBtn">📋 Xem chấm công</button>
<button id="logoutBtn">🚪 Đăng xuất</button>
<button id="Local" onclick="checkLocation()">Kiểm tra vị trí</button>
<div>
    <button id="reset">⏳ Quét lại</button>
</div>
<script>
// SỬA LỖI LOGIC: Gọi đúng hàm startScanner()
document.getElementById('reset').addEventListener('click', () => {
    startScanner();
});

    
/* ===================== LOGIN ===================== */
const userEmail = sessionStorage.getItem("userEmail");
if (!userEmail) location.href = "index.html";

    /* ============ BIẾN ============ */
    const VALID_QR = "CHECKIN_GLASS_COMPANY";
    const videoElem = document.getElementById("video");
    const resultDiv = document.getElementById("result");
    let scanner;
// Biến scanning không còn cần thiết nếu dùng logic của qr-scanner
// let scanning = false; 

/* ===================== FIREBASE ===================== */
firebase.initializeApp({
  apiKey: "AIzaSyAb5AZOBvEVY3a_9ioEKTW-wuVMXdnRZGQ",
  authDomain: "sellglass-3ebe9.firebaseapp.com",
  databaseURL: "https://sellglass-3ebe9-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sellglass-3ebe9",
  storageBucket: "sellglass-3ebe9.appspot.com",
  messagingSenderId: "513741829035",
  appId: "1:513741829035:web:1b2c59dcf1a0be329358ee"
});
const db = firebase.database();
    /* ================== BẮT ĐẦU CAMERA ================== */
    async function startScanner() {
        resultDiv.textContent = "Đang khởi động camera...";
        
        // Kiểm tra xem có camera không (đề xuất từ lần trước)
        if (!(await QrScanner.hasCamera())) {
             resultDiv.textContent = "❌ Không tìm thấy camera.";
             return;
        }

        if (scanner) scanner.stop();

        // Gọi scanner UMD
        scanner = new QrScanner(
            videoElem,
            result => {
                scanner.stop();
                handleQRCode(result.data);
            },
            {
                highlightScanRegion: true,
                highlightCodeOutline: true,
                // SỬA LỖI 2: Thêm workerScript
                workerScript: 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner-worker.min.js'
            }
        );

        scanner.start().catch(err => {
            // Hiển thị lỗi rõ ràng, thường là lỗi Quyền (NotAllowedError)
            resultDiv.textContent = "❌ Lỗi camera: " + err;
        });
    }

    /* ================== XỬ LÝ MÃ QR ================== */
    function handleQRCode(data) {
        if (data !== VALID_QR) {
            alert("❌ Mã QR không hợp lệ!");
            startScanner(); // Cho quét lại
            return;
        }

        resultDiv.textContent = "✅ Mã QR hợp lệ! Đang lấy GPS...";

        navigator.geolocation.getCurrentPosition(
            pos => {
                // SỬA LỖI 4: Gọi hàm saveAttendance
                saveAttendance(pos.coords.latitude, pos.coords.longitude);
            },
            err => {
                alert("❌ Không lấy được GPS: " + err.message);
                startScanner(); // Lỗi GPS, cho quét lại
            },
            { enableHighAccuracy: true, timeout: 8000 }
        );
    }

/* ===================== QR CHECK ===================== */
// SỬA LỖI 1: Xóa khai báo 'VALID_QR' trùng lặp
const COMPANY = { lat: 10.84964185816, lng: 106.58569113116 };

function encodeEmail(e) { return e.replace(/\./g, ","); }

    // tắt camera khi rời trang
window.addEventListener("pagehide", () => {
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
    }
    // Dừng hẳn scanner nếu có
    if (scanner) scanner.stop();
});

// bật camera lại
    document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        // quay lại trang → mở lại camera
        // SỬA LỖI 3: Gọi đúng hàm startScanner
        startScanner();
    } else {
        // rời trang → tắt camera
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
        }
        if (scanner) scanner.stop();
    }
});
    
/* ===================== TÍNH GIỜ ===================== */
// SỬA LỖI 6: Xóa hàm timeDiff bị trùng lặp (đã xóa hàm cũ đơn giản)
function distance(a, b, c, d) {
    const R = 6371000;
    let x = (c - a) * Math.PI / 180;
    let y = (d - b) * Math.PI / 180;
    let s = Math.sin(x/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}
function timeDiff(a, b) {
    if (!a || !b) return 0;

    // chỉ lấy HH:MM
    a = a.replace(/[^0-9:]/g, "");
    b = b.replace(/[^0-9:]/g, "");

    if (!a.includes(":") || !b.includes(":")) return 0;

    const pa = a.split(":").map(Number);
    const pb = b.split(":").map(Number);

    if (pa.length < 2 || pb.length < 2) return 0;
    if (isNaN(pa[0]) || isNaN(pa[1]) || isNaN(pb[0]) || isNaN(pb[1])) return 0;

    const t1 = pa[0] + pa[1] / 60;
    const t2 = pb[0] + pb[1] / 60;
    return t2 - t1;
}

        // Hàm checkLocation() đã được sửa lỗi logic và chuyển ra toàn cục
function checkLocation() {
    if (!navigator.geolocation) {
        alert('Trình duyệt không hỗ trợ geolocation!');
        return;
    }

    // Lấy vị trí hiện tại
    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            
            // THAY ĐỔI: Tính khoảng cách sau khi đã có tọa độ
            // Sử dụng các biến COMPANY_LOCATION và hàm getDistanceFromLatLonInMeters đã được định nghĩa ở phạm vi toàn cục
            const khoangcach =distance(lat, lng, COMPANY.lat, COMPANY.lng);
            
            // THAY ĐỔI: Hiển thị thông báo chi tiết
            alert(`✅ Vị trí hiện tại:
Vĩ độ: ${lat}, Kinh độ: ${lng}
Khoảng cách đến công ty: ${khoangcach.toFixed(2)} mét.`); // Hiển thị khoảng cách với 2 số thập phân
        },
        err => alert(`❌ Lỗi lấy vị trí: ${err.code} - ${err.message}`),
        { enableHighAccuracy: true, timeout: 10000 }
    );
}
/* ===================== LƯU CHẤM CÔNG ===================== */
function saveAttendance(lat, lng) {

    // Khoảng cách > 100m (bạn có thể tăng/giảm nếu cần)
    if (distance(lat, lng, COMPANY.lat, COMPANY.lng) > 50) {
        
        alert("❌ Bạn quá xa công ty!");
        setTimeout(() => {
                // SỬA LỖI 3: Gọi đúng hàm startScanner
                startScanner();
            }, 1000); // đợi người dùng bấm OK xong
        return;
        
    }

    const emailKey = encodeEmail(userEmail);
    const now = new Date();
    const day = now.toISOString().slice(0, 10);
    const time = now.toLocaleTimeString(); // Ví dụ: "08:30:15"
    const hour = now.getHours() + now.getMinutes() / 60;

    const ref = db.ref("chamcong/" + emailKey + "/" + day);

    ref.once("value").then((snap) => {
        let d = snap.val() || {};

        d.vaoCaSang ??= "";
        d.raCaSang ??= "";
        d.vaoCaTrua ??= "";
        d.raCaTrua ??= "";
        d.vaoCaChieu ??= "";
        d.raCaChieu ??= "";
        d.vaoLamThem ??= "";
        d.raLamThem ??= "";

        let msg = "";

        if (hour >= 7.5 && hour <= 11.5)
        {
            if(!d.vaoCaSang)
            {
                d.vaoCaSang = time;
                // msg="Vào ca sáng"; // Bị ghi đè
                msg="đi muộn!";
                d.noteVaoCaSang = "đi muộn";
            }
            else{
                 d.raCaSang = time;
                msg="Về sớm!";
                d.noteRaCaSang = "về sớm";
            }
                
        }
      else  if (hour < 7.5){
        if(!d.vaoCaSang)
        {
            d.vaoCaSang = time;
            msg="Sáng đi sớm";
             d.noteVaoCaSang = "đi sớm";
        }
      }
            
        // ======= CA TRƯA =======
// C. CA TRƯA (11:30 - 13:45)
        else if (hour > 11.5 && hour < 12.8) { 
            // 1. Auto Ra Ca Sáng nếu chưa có
            if (!d.raCaSang && d.vaoCaSang) {
                d.raCaSang = "11:30:00"; 
                d.noteRaCaSang = "auto đúng giờ";
            }
            
            // 2. Logic Vào/Ra Ca Trưa
            if (!d.vaoCaTrua) {
                // Lần quét đầu tiên trong khung giờ này là VÀO TRƯA
                d.vaoCaTrua = "11:30"; // Lưu giờ thực tế (ví dụ: 11:34:00)
                d.raCaTrua = time;
                d.noteVaoCaTrua="tăng ca trưa";
                
                msg = "tăng ca trưa";
            }
          //  else if (!d.raCaTrua) {
                // Lần quét thứ hai là RA TRƯA
           //     d.raCaTrua = time;
           //     msg = "Ra ca trưa";
           //     if (timeDiff(d.vaoCaTrua, d.raCaTrua) < 0.5) { 
            //        d.noteRaCaTrua = "nghỉ trưa quá ít";
            //    }
          //  } 
            else {
                msg = "Đã hoàn thành chấm công buổi trưa.!";
                d.vaoCaChieu = time;
                msg = "Vào ca chiều";
                d.noteVaoCaChieu="đi sớm";
            }
        }
// vào ca chiều
       else if (hour >=12.8 && hour < 17.5) 
       {
       
                     if(d.vaoCaTrua && !d.raCaTrua)
                         {
                              d.raCaTrua=d.vaoCaTrua;
                              d.vaoCaTrua="11:30";
                             d.noteRaCaTrua="ca trưa"
                         }
                    else if (!d.raCaSang&&!d.vaoCaTrua&&!d.raCaTrua)
                        {
                         d.raCaSang = "11:30";
                        d.vaoCaTrua="11:30";
                        d.raCaTrua="13:00";
                        msg = "làm xuyên trưa";
                        d.vaoCaChieu = time;
                        d.noteVaoCaTrua="làm xuyên trưa";
                    
                     }
             
                     else if(!d.vaoCaChieu) 
                       {
                         d.vaoCaChieu = time;
                         msg = "Vào ca chiều";
                         d.noteVaoCaChieu="đi sớm";
                           if(hour>13)
                           {
                               msg = "đi muộn chiều";
                               d.noteVaoCaChieu="đi muộn";
                           }
                        
                         }
       
       
             
            // SỬA LỖI 5: Lỗi chính tả 'RaCaSang' -> 'raCaSang'
                  else if (!d.raCaSang)
                    {
                         d.raCaSang="11:30";
                         d.vaoCaTrua="11:30";
                         d.raCaTrua="13:00";
                        
                         
                    }
                    else  {
                         d.raCaChieu = time;
                         msg = "Ra ca chiều";
                        
                         // 👉 Ghi chú ca chiều (ra sớm)
                               if (hour < 17.5) {
                                 d.noteRaCaChieu = "Về sớm";
                                 }
                    }
    
    }
   
                              
       else if (hour >= 17.5)
       {
          if( !d.vaoCaChieu||d.vaoCaChieu && !d.raCaChieu)
          {
             d.raCaChieu="17:30";
              d.vaoLamThem = "17:30";
             d.raLamThem = time;
             msg = "tăng ca tối - vào ghi chú để bổ sung";
             d.noteRaLamThem="tăng ca tối"
            
              
          }
              else if(d.vaoCaSang&&!d.vaoCaTrua&&!d.vaoCaChieu)
              {
                 
                  d.raCaSang="11:30";
                 d.vaoCaTrua="11:30";
                 d.raCaTrua="13:00";
                  d.vaoCaChieu="13:00";
                  d.raCaChieu="17:30";
                  d.vaoLamThem="17:30";
                  d.raLamThem=time;
                   msg = "Làm xuyên ngày ";
                  d.noteRaLamThem="làm xuyên ngày";
              }
           else {
                  d.vaoLamThem = "17:30";
                  d.raLamThem = time;
               msg = "tăng ca tối ";
               d.noteRaLamThem="tăng ca tối"
           }
           

       }
    

        // TÍNH GIỜ
        let total = 0;
total += timeDiff(d.vaoCaSang, d.raCaSang);
total += timeDiff(d.vaoCaTrua, d.raCaTrua); // Bạn đang tính giờ nghỉ trưa là giờ làm?
total += timeDiff(d.vaoCaChieu, d.raCaChieu);
d.gioLamTrongNgay = total.toFixed(2);

// Lưu ý: Bạn đang cộng giờ nghỉ trưa vào giờ làm thêm
let ot = timeDiff(d.vaoLamThem, d.raLamThem)+timeDiff(d.vaoCaTrua,d.raCaTrua);
d.gioLamThem = ot.toFixed(2);

        d.diaDiemQuet = `${lat},${lng}`;

        ref.set(d).then(() => {
         // scanning = false; // Không cần thiết nếu dùng logic của qr-scanner
            alert(
                "✔ Chấm công thành công!\n" +
                "📅 Ngày: "+day+"\n"+
                "⏰ "+time+"_"+msg+"\n"+
                "⏳ Giờ làm: "+d.gioLamTrongNgay+"h\n"+
                "🌙 Tăng ca: "+d.gioLamThem+"h"
            );

            setTimeout(() => {
                // SỬA LỖI 3: Gọi đúng hàm startScanner
                startScanner();
            }, 1000); // đợi người dùng bấm OK xong
             });
    });
}

// SỬA LỖI 3: Xóa bỏ hàm restartScan() và scanLoop() không cần thiết

/* ===================== BUTTONS ===================== */
document.getElementById("viewBtn").onclick = () =>
    location.href = "xem.html?user=" + userEmail;

document.getElementById("logoutBtn").onclick = () => {
    sessionStorage.clear();
    location.href = "index.html";
};

/* ===================== AUTO START ===================== */
    /* ================== AUTO MỞ CAMERA ================== */
    window.onload = startScanner;

</script>

</body>
</html>
