<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📸 Hệ Thống Nội Bộ</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #00ffff, #00c6ff);
            margin: 0;
            padding: 0 10px;
        }

        h1 {
            color: #ffffff;
            margin: 15px 0;
        }

        #video-container {
            margin: 20px auto;
            width: 100%;
            max-width: 360px;
            border: 4px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: auto;
        }

        /* Hiệu ứng khung quét */
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255,255,255,0.5);
            box-sizing: border-box;
            pointer-events: none;
        }

        #result {
            font-weight: bold;
            color: green;
            margin-top: 20px;
            white-space: pre-line;
            background: rgba(255,255,255,0.9);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        #error {
            color: red;
            margin-top: 10px;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            display: none;
            padding: 5px;
            border-radius: 5px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 20px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

            button:active {
                transform: scale(0.95);
            }

        .btn-attend {
            background-color: #28a745;
        }
        /* Xanh lá */
        .btn-map {
            background-color: #ffc107;
            color: #000;
        }
        /* Vàng */
        .btn-view {
            background-color: #17a2b8;
        }
        /* Xanh dương nhạt */
        .btn-logout {
            background-color: #dc3545;
        }
        /* Đỏ */
        .btn-reset {
            background-color: #6c757d;
            display: none;
        }
        /* Xám */

        #mode-indicator {
            margin: 10px auto;
            padding: 8px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            display: inline-block;
            border-radius: 20px;
            font-size: 14px;
        }

        @media (max-width:480px) {
            button {
                width: 45%;
                font-size: 13px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("zw8NnWti6A--Pyys9");
        })();
    </script>
</head>

<body>
    <audio id="beepSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <h1>📸 Hệ Thống Nội Bộ</h1>

    <div id="mode-indicator">Đang ở chế độ: <b>CHẤM CÔNG</b></div>

    <div id="video-container">
        <video id="qr-video" muted></video>
        <div class="scan-overlay"></div>
    </div>

    <div id="result"></div>
    <div id="error"></div>

    <div class="btn-group">
        <button id="restartBtn" class="btn-reset">🔄 Quét tiếp</button>
    </div>

    <div class="btn-group">
        <button id="modeAttendBtn" class="btn-attend">✅ Chế độ Chấm Công</button>
        <button id="modeMapBtn" class="btn-map">🗺️ Quét Vị Trí (Chỉ đường)</button>
    </div>
    <div class="btn-group">
        <button id="openMapBtn" class="btn-map" style="display:none; background-color: #4285F4; color: white;">🗺️ Mở Google Maps</button>
    </div>
    <div class="btn-group">
        <button id="viewBtn" class="btn-view">📋 Xem lịch sử</button>
        <button id="checkLocation" class="btn-view" style="background:#6f42c1">📍 Check GPS</button>
        <button id="logoutBtn" class="btn-logout">🚪 Đăng xuất</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

   <script type="module">
        import QrScanner from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAb5AZOBvEVY3a_9ioEKTW-wuVMXdnRZGQ",
            authDomain: "sellglass-3ebe9.firebaseapp.com",
            databaseURL: "https://sellglass-3ebe9-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sellglass-3ebe9",
            storageBucket: "sellglass-3ebe9.appspot.com",
            messagingSenderId: "513741829035",
            appId: "1:513741829035:web:1b2c59dcf1a0be329358ee"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const COMPANY_LOCATION = { lat: 10.849641858164617, lng: 106.58569113116769 };
        const VALID_QR_CHECKIN = "CHECKIN_GLASS_COMPANY";
        const SECURITY_PREFIX_MAP = "SECURE_MAP|";
        let currentMode = 'ATTENDANCE';
        let scanner;
        const userEmail = sessionStorage.getItem('userEmail');

        if (!userEmail) {
            alert('Vui lòng đăng nhập!');
            window.location.href = 'dangnhap.html';
        }

        const videoElem = document.getElementById('qr-video');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const restartBtn = document.getElementById('restartBtn');
        const modeIndicator = document.getElementById('mode-indicator');

        function startScanner() {
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            restartBtn.style.display = 'none';
            
            if (currentMode === 'ATTENDANCE') {
                modeIndicator.innerHTML = "Đang ở chế độ: <b>CHẤM CÔNG</b>";
                modeIndicator.style.background = "rgba(40, 167, 69, 0.8)";
            } else {
                modeIndicator.innerHTML = "Đang ở chế độ: <b>QUÉT VỊ TRÍ BẢO MẬT</b>";
                modeIndicator.style.background = "rgba(255, 193, 7, 0.8)";
            }

            if (scanner) { scanner.start(); return; }
            scanner = new QrScanner(videoElem, result => processQrCode(result.data), {
                highlightScanRegion: true, highlightCodeOutline: true
            });
            scanner.start().catch(err => showError('❌ Lỗi Camera: ' + err));
        }

        function processQrCode(qrContent) {
            scanner.stop();
            document.getElementById('beepSound').play().catch(() => { });

            if (currentMode === 'ATTENDANCE') {
                navigator.geolocation.getCurrentPosition(
                    pos => handleAttendance(userEmail, qrContent, pos.coords.latitude, pos.coords.longitude),
                    err => {
                        console.warn('GPS Error:', err);
                        handleAttendance(userEmail, qrContent, null, null);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else if (currentMode === 'MAP') {
                handleSecureMap(qrContent);
            }
        }

        // ... (Giữ nguyên hàm handleSecureMap của bạn) ...
        function handleSecureMap(qrContent) { /* Code Map cũ giữ nguyên */ 
            try {
                let decodedString = atob(qrContent);
                if (decodedString.startsWith(SECURITY_PREFIX_MAP)) {
                    const coords = decodedString.replace(SECURITY_PREFIX_MAP, '');
                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                    let url = isMobile ? `google.navigation:q=${coords}` : `http://googleusercontent.com/maps.google.com/?q=${coords}`;
                    window.open(url, '_blank');
                    showSuccess(`✅ Đã mở bản đồ: ${coords}`);
                    restartBtn.style.display = 'inline-block';
                }
            } catch(e) { showError('QR Map lỗi'); restartBtn.style.display='inline-block';}
        }

        // ================== LOGIC CHẤM CÔNG CẬP NHẬT ==================
        function handleAttendance(email, qrContent, lat, lng) {
            if (qrContent !== VALID_QR_CHECKIN) {
                showError('❌ Mã QR không hợp lệ!'); restartBtn.style.display = 'inline-block'; return;
            }
            if (lat && lng) {
                const d = getDistanceFromLatLonInMeters(lat, lng, COMPANY_LOCATION.lat, COMPANY_LOCATION.lng);
                if (d > 100) { showError(`❌ Quá xa: ${d.toFixed(1)}m`); restartBtn.style.display = 'inline-block'; return; }
            } else {
                showError('❌ Lỗi GPS!'); restartBtn.style.display = 'inline-block'; return;
            }

            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const currentTime = now.toLocaleTimeString('en-GB', { hour12: false });
            const currentHour = now.getHours() + now.getMinutes() / 60;
            const emailKey = email.replace(/\./g, ',');
            const ref = db.ref('chamcong/' + emailKey + '/' + today);

            ref.once('value').then(snapshot => {
                let data = snapshot.val() || {};
                let msgScreen = '';

                // Hàm tiện ích để nối chuỗi ghi chú (bỏ qua dấu "-" hoặc null)
                const appendNote = (oldNote, newMsg) => {
                    if (!oldNote || oldNote === '-' || oldNote === '""') return newMsg;
                    if (oldNote.includes(newMsg)) return oldNote; // Tránh lặp
                    return oldNote + "; " + newMsg;
                };

                // --- 1. SÁNG (< 11:30) ---
                if (currentHour < 11.5) {
                    if (!data.vaoCaSang) {
                        data.vaoCaSang = currentTime;
                        let status = currentHour < 7.5 ? 'Đúng giờ' : `Đi muộn (${currentTime})`;
                        data.noteVaoCaSang = appendNote(data.noteVaoCaSang, status);
                        msgScreen = '✅ Vào ca sáng: ' + status;
                    } else {
                        data.raCaSang = currentTime;
                        data.noteVaoCaSang = appendNote(data.noteVaoCaSang, `Về sớm (${currentTime})`);
                        msgScreen = '⚠️ Ra ca sáng sớm!';
                    }
                }

                // --- 2. TRƯA (11:30 - 13:00) ---
                else if (currentHour >= 11.5 && currentHour < 13.0) {
                    // Tự động chốt sáng
                    if (data.vaoCaSang && !data.raCaSang) {
                        data.raCaSang = "11:30:00";
                        data.vaoCaTrua = "11:30:00";
                        data.noteVaoCaSang = appendNote(data.noteVaoCaSang, "Auto chốt ra");
                        data.noteVaoCaTrua = appendNote(data.noteVaoCaTrua, "Auto vào trưa");
                        msgScreen = '✅ Auto chốt Sáng & Vào Trưa.';
                    } 
                    
                    if (!data.raCaTrua && data.vaoCaTrua) {
                        data.raCaTrua = currentTime;
                        data.noteVaoCaTrua = appendNote(data.noteVaoCaTrua, "Ra trưa");
                        msgScreen = '✅ Ra ca trưa.';
                    } else if (!data.vaoCaTrua) {
                        data.vaoCaTrua = currentTime;
                        data.noteVaoCaTrua = appendNote(data.noteVaoCaTrua, "Vào trưa");
                        msgScreen = '✅ Vào ca trưa.';
                    }
                }

                // --- 3. CHIỀU & TĂNG CA (>= 13:00) ---
                else {
                    // --- A. CHIỀU (<= 17:30) ---
                    if (currentHour <= 17.5) {
                        if (!data.vaoCaChieu) {
                            data.vaoCaChieu = currentTime;
                            let status = currentHour > 13.05 ? `Muộn chiều (${currentTime})` : "Đúng giờ";
                            data.noteVaoCaChieu = appendNote(data.noteVaoCaChieu, status);
                            msgScreen = '✅ Vào ca chiều: ' + status;
                        } else {
                            data.raCaChieu = currentTime;
                            data.noteVaoCaChieu = appendNote(data.noteVaoCaChieu, `Về sớm (${currentTime})`);
                            msgScreen = '⚠️ Ra chiều sớm!';
                        }
                    } 
                    // --- B. TĂNG CA (> 17:30) ---
                    else {
                        // Tự động lấp đầy quá khứ
                        if (data.vaoCaSang && !data.raCaSang) {
                            data.raCaSang = "11:30:00"; data.vaoCaTrua = "11:30:00";
                            data.noteVaoCaSang = appendNote(data.noteVaoCaSang, "Quên ra sáng (Auto)");
                        }
                        if (!data.vaoCaChieu) {
                            if (!data.raCaTrua && data.vaoCaTrua) data.raCaTrua = "13:00:00";
                            data.vaoCaChieu = "13:00:00";
                            data.noteVaoCaChieu = appendNote(data.noteVaoCaChieu, "Quên vào chiều (Auto)");
                        }
                        if (!data.raCaChieu) {
                            data.raCaChieu = "17:30:00";
                            data.vaoLamThem = "17:30:00";
                            data.noteVaoCaChieu = appendNote(data.noteVaoCaChieu, "Auto chốt ra 17:30");
                            data.noteVaoLamThem = appendNote(data.noteVaoLamThem, "Bắt đầu OT 17:30");
                            msgScreen = 'ℹ️ Đã tự chốt công hành chính.';
                        }

                        // Cập nhật giờ ra làm thêm
                        data.raLamThem = currentTime;
                        msgScreen += ` 💪 Cập nhật OT: ${currentTime}`;

                        // Nhập ghi chú (chỉ 1 lần)
                        if (!data.daNhapGhiChuOT) {
                            let note = prompt("📝 Nhập nội dung công việc làm thêm:");
                            if (note) {
                                // Ghi đè hoặc nối vào noteVaoLamThem
                                data.noteVaoLamThem = appendNote(data.noteVaoLamThem, note);
                                data.daNhapGhiChuOT = true;
                            }
                        }
                    }
                }

                // --- TÍNH TOÁN ---
                const parse = t => { if(!t) return 0; const [h,m] = t.split(':'); return Number(h) + Number(m)/60; };
                
                let hanhChinh = 0;
                if(data.vaoCaSang && data.raCaSang) hanhChinh += parse(data.raCaSang) - parse(data.vaoCaSang);
                if(data.vaoCaChieu && data.raCaChieu) hanhChinh += parse(data.raCaChieu) - parse(data.vaoCaChieu);
                
                let lamThem = 0;
                if(data.vaoLamThem && data.raLamThem) lamThem = parse(data.raLamThem) - parse(data.vaoLamThem);

                data.gioLamTrongNgay = hanhChinh.toFixed(2);
                data.gioLamThem = lamThem.toFixed(2); // Lưu riêng cột này để không bị âm
                data.diadiemQuet = `${lat},${lng}`;
                
                // Lưu vào DB
                ref.update(data).then(() => {
                    showSuccess(`✅ Thành công!\nHC: ${data.gioLamTrongNgay}h | OT: ${data.gioLamThem}h\n${msgScreen}`);
                    restartBtn.style.display = 'inline-block';
                });

            }).catch(e => showError('Lỗi Firebase: ' + e));
        }

        // ... (Các hàm phụ trợ cũ giữ nguyên: showSuccess, showError, deg2rad, getDistance, ...)
        function showSuccess(msg) { resultDiv.textContent = msg; resultDiv.style.display = 'block'; errorDiv.style.display = 'none'; }
        function showError(msg) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; resultDiv.style.display = 'none'; }
        function deg2rad(deg) { return deg * Math.PI / 180; }
        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        document.getElementById('modeAttendBtn').addEventListener('click', () => { currentMode = 'ATTENDANCE'; startScanner(); });
        document.getElementById('modeMapBtn').addEventListener('click', () => { currentMode = 'MAP'; startScanner(); });
        document.getElementById('restartBtn').addEventListener('click', startScanner);
        document.getElementById('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('userEmail'); window.location.href = 'dangnhap.html'; });
        document.getElementById('viewBtn').addEventListener('click', () => { window.location.href = 'xem.html'; });
        document.getElementById('checkLocation').addEventListener('click', () => {
            navigator.geolocation.getCurrentPosition(pos => {
                const d = getDistanceFromLatLonInMeters(pos.coords.latitude, pos.coords.longitude, COMPANY_LOCATION.lat, COMPANY_LOCATION.lng);
                alert(`📍 Lat: ${pos.coords.latitude}\nLng: ${pos.coords.longitude}\nCách công ty: ${d.toFixed(1)}m`);
            }, err => alert('Lỗi GPS: ' + err.message));
        });

        window.addEventListener('load', startScanner);
    </script>
</body>
</html>
